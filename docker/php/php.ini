memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 32M
post_max_size = 32M

date.timezone = UTC

; Development settings. Flip display_errors off and validate_timestamps to 0
; for a production image.
display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; Xdebug. Armed all the time -- an idle debugger costs about 10% on a Laravel
; boot, which is cheaper than remembering to turn it on. Nothing connects to the
; IDE until a request carries the trigger (the browser extension, ?XDEBUG_TRIGGER=1,
; or XDEBUG_TRIGGER=1 on a CLI call); PhpStorm sends it itself when you hit Debug.
; Set XDEBUG_MODE=off in the environment to disable it entirely.
[xdebug]
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = false
; raise to 7 and read /tmp/xdebug.log when a connection never reaches the IDE
xdebug.log_level = 0
